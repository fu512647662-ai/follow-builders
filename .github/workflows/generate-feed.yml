name: Sync Upstream Feeds

on:
  schedule:
    # Upstream generates feeds at 6am UTC; mirror them shortly after.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sync feed files from upstream
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/zarazhangrui/follow-builders/main"
          for file in feed-x.json feed-podcasts.json feed-blogs.json state-feed.json; do
            curl -fsSL "$base/$file" -o "$file"
          done

      - name: Commit and push mirrored feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json
          git diff --cached --quiet || git commit -m "chore: sync upstream feeds [skip ci]"
          git push
